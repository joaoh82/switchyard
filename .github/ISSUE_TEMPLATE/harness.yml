name: Agent (harness) support
description: A built-in agent definition is wrong or out of date, or you would like a new one built in
labels: [harness]
body:
  - type: markdown
    attributes:
      value: |
        Any terminal agent can already be added in **Settings → Harnesses → Add custom harness** —
        see the [guide](https://github.com/joaoh82/switchyard/blob/main/docs/guide/settings.md#adding-your-own-harness).
        Use this form when a **built-in** definition should change, or to propose a new built-in.
  - type: input
    id: agent
    attributes:
      label: Agent and version
      placeholder: codex-cli 0.154.0
    validations:
      required: true
  - type: textarea
    id: definition
    attributes:
      label: What should the definition be?
      description: Command and arguments for starting with a prompt, choosing a model, resuming and forking. The relevant part of the agent's `--help` is ideal.
      render: text
    validations:
      required: true

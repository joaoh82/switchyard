name: Release

# Pushing a version tag (v0.2.0, v0.2.0-beta.1) builds installers for every platform and publishes
# them as a GitHub release. The release stays a draft while the builds upload and goes public only
# if every platform succeeded, so nobody ever sees a half-filled one. See docs/releasing.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.2.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: The tag must match the version in the code
        run: |
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match version $version in src-tauri/tauri.conf.json. Use 'just release <version>'."
            exit 1
          fi

      - name: Create the draft (or reuse it)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" --draft --verify-tag --generate-notes --title "Switchyard $TAG" $prerelease
          fi
          echo "id=$(gh release view "$TAG" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            args: ""
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - run: bun install --frozen-lockfile

      # Signing is optional: without the secrets the macOS build is simply unsigned. The
      # variables must be *absent* in that case — Tauri treats an empty one as a broken setup.
      - name: Enable macOS signing and notarization
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::No Apple certificate configured: this macOS build is unsigned. See docs/releasing.md."
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "::error::$name is not set, but APPLE_CERTIFICATE is. All six are needed; see docs/releasing.md."
              exit 1
            fi
            {
              echo "$name<<__SWITCHYARD_EOF__"
              echo "$value"
              echo "__SWITCHYARD_EOF__"
            } >> "$GITHUB_ENV"
          done

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          tauriScript: bun tauri
          args: ${{ matrix.args }}

  publish:
    name: Publish release
    needs: [draft, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Every platform built — make the release public
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json url,assets -q '.url, (.assets[] | "  " + .name)'

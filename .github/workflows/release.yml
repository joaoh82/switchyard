name: Release

# Pushing a version tag (v0.2.0, v0.2.0-beta.1) builds installers for every platform and publishes
# them as a GitHub release. The release stays a draft while the builds upload and goes public only
# if every platform succeeded, so nobody ever sees a half-filled one. See docs/releasing.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.2.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: The tag must match the version in the code
        run: |
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match version $version in src-tauri/tauri.conf.json. Use 'just release <version>'."
            exit 1
          fi

      - name: Create the draft (or reuse it)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" --draft --verify-tag --generate-notes --title "Yardsort $TAG" $prerelease
          fi
          echo "id=$(gh release view "$TAG" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            args: ""
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - run: bun install --frozen-lockfile

      # Signing is optional: without the secrets the macOS build is simply unsigned. The
      # variables must be *absent* in that case — Tauri treats an empty one as a broken setup.
      - name: Enable macOS signing and notarization
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::No Apple certificate configured: this macOS build is unsigned. See docs/releasing.md."
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "::error::$name is not set, but APPLE_CERTIFICATE is. All six are needed; see docs/releasing.md."
              exit 1
            fi
            {
              echo "$name<<__YARDSORT_EOF__"
              echo "$value"
              echo "__YARDSORT_EOF__"
            } >> "$GITHUB_ENV"
          done

      # `tauri.release.conf.json` switches on updater artifacts: each self-updating bundle is signed
      # with the update key, and a `latest.json` describing them is attached to the release — that
      # is what installed copies read to find out about this version. See docs/releasing.md.
      - name: Build, sign and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          tauriScript: bun tauri
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.args }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  publish:
    name: Publish release
    needs: [draft, build]
    runs-on: ubuntu-24.04
    steps:
      # An installed copy that finds no `latest.json` cannot update, silently. Refuse to publish
      # a release that would strand them.
      - name: The release must carry the update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$TAG" --pattern latest.json --output latest.json
          for platform in linux-x86_64 darwin-aarch64 darwin-x86_64 windows-x86_64; do
            jq -e --arg p "$platform" '.platforms | to_entries | any(.key | startswith($p)) ' latest.json >/dev/null \
              || { echo "::error::latest.json has no entry for $platform"; jq '.platforms | keys' latest.json; exit 1; }
          done
          jq '{version, platforms: (.platforms | keys)}' latest.json

      - name: Every platform built — make the release public
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json url,assets -q '.url, (.assets[] | "  " + .name)'

  # Publish the release to the Arch User Repository as `yardsort-bin`. Skipped for pre-releases,
  # and when no AUR deploy key is configured. See docs/releasing.md.
  aur:
    name: Publish to the AUR
    needs: publish
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git openssh curl

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Render, build and publish the package
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::warning::No AUR_SSH_PRIVATE_KEY secret: the AUR package was not updated. See docs/releasing.md."
            exit 0
          fi
          version="${TAG#v}"

          # makepkg refuses to run as root.
          useradd --create-home builder
          install -d -o builder -g builder /work
          chown -R builder:builder "$GITHUB_WORKSPACE"
          run() { sudo -u builder --preserve-env=HOME env HOME=/home/builder "$@"; }

          run install -d -m 700 /home/builder/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" | run tee /home/builder/.ssh/aur >/dev/null
          run chmod 600 /home/builder/.ssh/aur
          # The AUR's published host keys, so nothing is trusted on first use.
          run tee /home/builder/.ssh/known_hosts >/dev/null <<'KEYS'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          KEYS
          export GIT_SSH_COMMAND="ssh -i /home/builder/.ssh/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=/home/builder/.ssh/known_hosts"

          # A key that no AUR account knows yet is a setup step still to do, not a broken release.
          if ! run env GIT_SSH_COMMAND="$GIT_SSH_COMMAND" git ls-remote ssh://aur@aur.archlinux.org/yardsort-bin.git >/dev/null 2>/tmp/aur-auth; then
            if grep -q "Permission denied" /tmp/aur-auth; then
              echo "::warning::The AUR does not accept the deploy key yet — register its public half on the AUR account (docs/releasing.md). The AUR package was not updated."
              exit 0
            fi
            cat /tmp/aur-auth; exit 1
          fi

          run env GIT_SSH_COMMAND="$GIT_SSH_COMMAND" git clone ssh://aur@aur.archlinux.org/yardsort-bin.git /work/aur
          run scripts/aur-render.sh "$version" /work/aur

          # Prove the package actually builds before anyone is told about it.
          (cd /work/aur && run makepkg --force --nodeps --noconfirm)
          run bash -c 'cd /work/aur && pkg=$(ls yardsort-bin-*.pkg.tar.* | head -1) && bsdtar -tf "$pkg" | grep -qx usr/bin/yardsort'

          cd /work/aur
          run git add PKGBUILD .SRCINFO
          if run git diff --cached --quiet; then
            echo "The AUR package is already at $version."
            exit 0
          fi
          run git -c user.name="Yardsort release bot" -c user.email="noreply@github.com" commit -m "Update to $version"
          run env GIT_SSH_COMMAND="$GIT_SSH_COMMAND" git push origin HEAD:master

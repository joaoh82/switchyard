[package]
name = "switchyard"
description = "Run AI coding agents in parallel, each on its own track"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which matters on Windows:
# https://github.com/rust-lang/cargo/issues/8519
name = "switchyard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
pty-host = { path = "../crates/pty-host", features = ["specta"] }
which = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
